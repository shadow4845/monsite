<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streameurs – Shadow</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="banner">
<main style="max-width:1000px">
  <h1 class="grad" style="font-size:40px;margin:20px 0 6px">Streameurs</h1>
  <p style="color:#bbb;margin-bottom:24px">Les streameurs de la communauté Shadow.</p>
  <div id="list" class="grid"><p style="color:#777">Chargement…</p></div>
</main>
<script type="module">
import { db, collection, getDocs } from "./app.js";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chan = u => String(u||"").replace(/^https?:\/\/(www\.)?twitch\.tv\//,"").replace(/\/.*$/,"");
const snap = await getDocs(collection(db, "streamers"));
let L = snap.docs.map(d => d.data()).sort((a,b)=>(a.order||0)-(b.order||0));
if (!L.length) L = [{ name:"NemesisShadow", role:"Fondateur", twitch:"shadow__officielle" }];
document.getElementById("list").innerHTML = L.map(s => { const c = chan(s.twitch); return `<div class="card" style="text-align:center">
  <img src="${esc(s.avatar || (c ? "https://unavatar.io/twitch/"+c+"?fallback=false" : "logo.png"))}" onerror="this.onerror=null;this.src='logo.png'" alt="" style="width:90px;height:90px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px #a855f7;margin-bottom:10px">
  <h2>${esc(s.name)}</h2><p style="color:#bbb;margin:6px 0 14px">${esc(s.role||"")}</p>
  ${c?`<a class="pill" style="background:#9146ff" href="https://www.twitch.tv/${esc(c)}" target="_blank" rel="noopener">📺 Twitch</a>`:""}
  ${s.youtube?` <a class="pill" style="background:#dc2626" href="${esc(s.youtube)}" target="_blank" rel="noopener">▶ YouTube</a>`:""}
  ${s.tiktok?` <a class="pill" style="background:#111;border:1px solid #444" href="${esc(s.tiktok)}" target="_blank" rel="noopener">🎵 TikTok</a>`:""}
</div>`; }).join("");
</script>
<script type="module" src="nav.js"></script>
</body>
</html>
