<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de trades – Shadow</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  main{max-width:1150px}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:800px){.board{grid-template-columns:1fr}}
  .side h2{margin-bottom:12px}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .slot{position:relative;height:130px;border-radius:14px;border:2px dashed #4b2d73;background:rgba(20,10,35,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;text-align:center;padding:8px}
  .slot:hover{border-color:#a855f7;background:rgba(60,20,100,.5)}
  .slot.full{border-style:solid;border-color:#7c3aed}
  .slot .plus{font-size:34px;color:#7c3aed}
  .slot .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-bottom:6px}
  .slot b{font-size:14px}.slot small{color:#bbb;font-size:12px}
  .slot .x{position:absolute;top:6px;right:8px;color:#f87171;font-weight:800}
  .slot .perm{position:absolute;top:6px;left:8px;font-size:10px;background:#a855f7;padding:1px 6px;border-radius:99px}
  .sum{margin-top:12px;padding:14px;border-radius:12px;background:rgba(20,10,35,.75);border:1px solid #2a2a40;line-height:1.8}
  .sum b{color:#fff}
  .bar{height:14px;border-radius:99px;background:#1f1630;overflow:hidden;margin-top:22px;display:flex}
  .bar div{height:100%}
  .verdict{text-align:center;font-size:28px;font-weight:800;margin-top:14px;padding:16px;border-radius:14px}
  .win{background:rgba(34,197,94,.15);color:#4ade80}.lose{background:rgba(239,68,68,.15);color:#f87171}.fair{background:rgba(168,85,247,.15);color:#c084fc}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
  .modal.show{display:flex}
  .picker{width:min(900px,100%);max-height:85vh;overflow:auto;background:#120a1f;border:1px solid #6b4a9a;border-radius:18px;padding:20px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{background:#2a1a40;padding:6px 12px;font-size:13px}.tabs button.on{background:linear-gradient(90deg,#7c3aed,#a855f7)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .fruit{padding:10px;border-radius:12px;background:#1d1230;border:1px solid #33224d;cursor:pointer;text-align:center}
  .fruit:hover{border-color:#a855f7}
  .fruit .ic{width:42px;height:42px;border-radius:10px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .fruit small{display:block;color:#aaa;font-size:11px}
  .r-Mythical{background:linear-gradient(135deg,#ef4444,#7c3aed)}.r-Legendary{background:linear-gradient(135deg,#a855f7,#ec4899)}
  .r-Rare{background:linear-gradient(135deg,#3b82f6,#06b6d4)}.r-Uncommon{background:linear-gradient(135deg,#22c55e,#14b8a6)}.r-Common{background:#4b5563}.r-Gamepass{background:linear-gradient(135deg,#f59e0b,#ef4444)}.r-Skin{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
</style>
</head>
<body class="banner">
<main>
  <h1 class="grad" style="font-size:38px;margin:18px 0 4px">🍎 Calculateur de trades</h1>
  <p style="color:#bbb;margin-bottom:20px">Clique sur une case pour ajouter un fruit (4 max par côté — fruits, perm, gamepasses et skins). Valeurs gérées par le staff · référence marché : <a href="https://bloxfruitsvalues.com/" target="_blank" rel="noopener">bloxfruitsvalues.com</a></p>
  <div class="board">
    <div class="side"><h2>🟣 Toi (tu donnes)</h2><div class="slots" id="A"></div><div class="sum" id="sumA"></div></div>
    <div class="side"><h2>⚫ Lui (tu reçois)</h2><div class="slots" id="B"></div><div class="sum" id="sumB"></div></div>
  </div>
  <div class="bar"><div id="barA" style="background:#a855f7;width:50%"></div><div id="barB" style="background:#3b82f6;width:50%"></div></div>
  <div class="verdict fair" id="verdict">Ajoute des fruits pour comparer</div>
  <div style="text-align:center;margin-top:12px"><button class="grey" id="reset">↺ Réinitialiser</button></div>
  <p id="info" style="color:#777;font-size:13px;margin-top:14px;text-align:center"></p>
</main>

<div class="modal" id="modal"><div class="picker">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
    <input id="search" placeholder="🔎 Rechercher un fruit…" style="margin:0;flex:1">
    <label style="display:flex;gap:6px;align-items:center;margin:0;white-space:nowrap"><input type="checkbox" id="permChk" style="width:auto;margin:0"> Permanent</label>
    <button class="red small" id="close">✕</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="fgrid" id="fgrid"></div>
</div></div>

<script type="module">
import { db, collection, getDocs } from "./app.js";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n>=1e9?(n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B":n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(Math.round(n));
// Liste de base des fruits (rareté du jeu). Valeurs = celles saisies dans l'admin.
const fid = n => n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-");
const ITEMS = [{"name": "West Dragon", "cat": "Fruit", "rarity": "Mythical", "value": 2760000000, "demand": 9, "permValue": 5040000000, "permDemand": 9, "image": "https://i.postimg.cc/7LfBxxs8/West-Dragon.png"}, {"name": "East Dragon", "cat": "Fruit", "rarity": "Mythical", "value": 2310000000, "demand": 9, "permValue": 5040000000, "permDemand": 9, "image": "https://i.postimg.cc/gkzHzzjS/East-Dragon.png"}, {"name": "Kitsune", "cat": "Fruit", "rarity": "Mythical", "value": 450000000, "demand": 10, "permValue": 3960000000, "permDemand": 10, "image": "https://i.postimg.cc/CLxbycr9/Kitsune.png"}, {"name": "Control", "cat": "Fruit", "rarity": "Mythical", "value": 90000000, "demand": 7, "permValue": 3960000000, "permDemand": 7, "image": "https://i.postimg.cc/9QNpg6Wx/Control.png"}, {"name": "Magnet", "cat": "Fruit", "rarity": "Mythical", "value": 300000000, "demand": 6, "permValue": 3420000000, "permDemand": 10, "image": "https://i.postimg.cc/2S7qNH21/latest-cb-20260905110645.webp"}, {"name": "Yeti", "cat": "Fruit", "rarity": "Mythical", "value": 70000000, "demand": 6, "permValue": 2880000000, "permDemand": 6, "image": "https://i.postimg.cc/mrJmk0Jc/Yeti.png"}, {"name": "Gas", "cat": "Fruit", "rarity": "Mythical", "value": 60000000, "demand": 10, "permValue": 2310000000, "permDemand": 7, "image": "https://i.postimg.cc/XNCpc4fS/1000-cb-20241223162315.webp"}, {"name": "Tiger", "cat": "Fruit", "rarity": "Mythical", "value": 80000000, "demand": 7, "permValue": 2880000000, "permDemand": 7, "image": "https://i.postimg.cc/vBDS3KNp/download.png"}, {"name": "Lightning", "cat": "Fruit", "rarity": "Legendary", "value": 20000000, "demand": 6, "permValue": 1830000000, "permDemand": 8, "image": "https://i.postimg.cc/MHTHLFZD/Rumble.png"}, {"name": "Venom", "cat": "Fruit", "rarity": "Mythical", "value": 120000000, "demand": 10, "permValue": 0, "permDemand": 4, "image": "https://i.postimg.cc/zGdtZLkF/Venom.png"}, {"name": "Dough", "cat": "Fruit", "rarity": "Mythical", "value": 30000000, "demand": 10, "permValue": 2190000000, "permDemand": 8, "image": "https://i.postimg.cc/wxckYyqR/Dough.png"}, {"name": "Pain", "cat": "Fruit", "rarity": "Legendary", "value": 10000000, "demand": 5, "permValue": 1950000000, "permDemand": 5, "image": "https://i.postimg.cc/mk21srj7/Pain.png"}, {"name": "T-Rex", "cat": "Fruit", "rarity": "Mythical", "value": 20000000, "demand": 8, "permValue": 2130000000, "permDemand": 6, "image": "https://i.postimg.cc/zGDtcwTf/T-Rex.png"}, {"name": "Gravity", "cat": "Fruit", "rarity": "Mythical", "value": 10000000, "demand": 5, "permValue": 2069999999, "permDemand": 5, "image": "https://i.postimg.cc/D02Lw6vJ/Gravity.png"}, {"name": "Mammoth", "cat": "Fruit", "rarity": "Mythical", "value": 10000000, "demand": 5, "permValue": 2130000000, "permDemand": 4, "image": "https://i.postimg.cc/sXJGqWYV/Mammoth.png"}, {"name": "Spirit", "cat": "Fruit", "rarity": "Mythical", "value": 10000000, "demand": 7, "permValue": 2370000000, "permDemand": 4, "image": "https://i.postimg.cc/wTpbhYvL/Spirit.png"}, {"name": "Shadow", "cat": "Fruit", "rarity": "Mythical", "value": 6500000, "demand": 5, "permValue": 2220000000, "permDemand": 4, "image": "https://i.postimg.cc/kGpGPvBd/Shadow.png"}, {"name": "Portal", "cat": "Fruit", "rarity": "Legendary", "value": 10000000, "demand": 10, "permValue": 1710000000, "permDemand": 9, "image": "https://i.postimg.cc/DzkWz65v/Portal.png"}, {"name": "Buddha", "cat": "Fruit", "rarity": "Legendary", "value": 10000000, "demand": 10, "permValue": 1320000000, "permDemand": 10, "image": "https://i.postimg.cc/02nZD6h1/Buddha.png"}, {"name": "Blizzard", "cat": "Fruit", "rarity": "Legendary", "value": 5000000, "demand": 5, "permValue": 2009999999, "permDemand": 4, "image": "https://i.postimg.cc/fTDBV72v/Blizzard.png"}, {"name": "Creation", "cat": "Fruit", "rarity": "Legendary", "value": 2000000, "demand": 2, "permValue": 1410000000, "permDemand": 3, "image": "https://i.postimg.cc/HLctq6nT/Creation.png"}, {"name": "Phoenix", "cat": "Fruit", "rarity": "Legendary", "value": 2750000, "demand": 3, "permValue": 1710000000, "permDemand": 3, "image": "https://i.postimg.cc/DwbJFHrp/Phoenix.png"}, {"name": "Sound", "cat": "Fruit", "rarity": "Legendary", "value": 2500000, "demand": 4, "permValue": 1590000000, "permDemand": 3, "image": "https://i.postimg.cc/MKgHs5C7/Sound.png"}, {"name": "Spider", "cat": "Fruit", "rarity": "Legendary", "value": 1500000, "demand": 2, "permValue": 1470000000, "permDemand": 3, "image": "https://i.postimg.cc/MpRTgRwh/Spider.png"}, {"name": "Fruit Notifier", "cat": "Gamepass", "rarity": "Gamepass", "value": 2540000000, "demand": 9, "image": "https://i.postimg.cc/Zqdr70sR/Fruit-Notifer.png"}, {"name": "Dark Blade", "cat": "Gamepass", "rarity": "Gamepass", "value": 750000000, "demand": 9, "image": "https://i.postimg.cc/fLYfLkYF/Dark-Blade.png"}, {"name": "Mythical Scrolls", "cat": "Gamepass", "rarity": "Gamepass", "value": 1080000000, "demand": 4, "image": "https://i.postimg.cc/d3HktKNp/Mythical-Scrolls.png"}, {"name": "Legendary Scrolls", "cat": "Gamepass", "rarity": "Gamepass", "value": 480000000, "demand": 3, "image": "https://i.postimg.cc/YqDYtQJ0/Legendary-Scrolls.png"}, {"name": "+1 Fruit Storage", "cat": "Gamepass", "rarity": "Gamepass", "value": 270000000, "demand": 10, "image": "https://i.postimg.cc/hj7pmcdF/1-Fruit-Storage.png"}, {"name": "2x Mastery", "cat": "Gamepass", "rarity": "Gamepass", "value": 300000000, "demand": 10, "image": "https://i.postimg.cc/0jdntrQm/2x-Mastery.png"}, {"name": "2x Money", "cat": "Gamepass", "rarity": "Gamepass", "value": 300000000, "demand": 10, "image": "https://i.postimg.cc/rsLgC58M/2x-Money.png"}, {"name": "2x Boss Drops", "cat": "Gamepass", "rarity": "Gamepass", "value": 180000000, "demand": 8, "image": "https://i.postimg.cc/HxMBy616/2x-Boss-Drops.png"}, {"name": "Fast Boats", "cat": "Gamepass", "rarity": "Gamepass", "value": 180000000, "demand": 9, "image": "https://i.postimg.cc/NjV6kR4S/Fast-Boats.png"}, {"name": "Hellfire Gas", "cat": "Skin", "rarity": "Skin", "value": 80000000, "demand": 5, "image": ""}, {"name": "Doghouse (Frame Break)", "cat": "Skin", "rarity": "Skin", "value": 11550000000, "demand": 7, "image": "https://i.postimg.cc/gkCRMCfR/Doghouse-(Frame-Break).png"}, {"name": "Rabid Dog Blade", "cat": "Skin", "rarity": "Skin", "value": 22410000000, "demand": 8, "image": "https://i.postimg.cc/jdpN8pGf/Rabid-Dog-Blade.png"}, {"name": "Dog Blade", "cat": "Skin", "rarity": "Skin", "value": 1530000000, "demand": 7, "image": "https://i.postimg.cc/L6cfycr1/Dog-Blade.png"}, {"name": "Fiend Yeti", "cat": "Skin", "rarity": "Skin", "value": 930000000, "demand": 7, "image": "https://i.postimg.cc/fbBmGbCv/latest-cb-20260214132352.webp"}, {"name": "Galaxy Empyrean Kitsune", "cat": "Skin", "rarity": "Skin", "value": 9360000000, "demand": 10, "image": "https://i.postimg.cc/k5JRY7vf/latest-cb-20251226164613.webp"}, {"name": "Ember West Dragon", "cat": "Skin", "rarity": "Skin", "value": 6150000000, "demand": 9, "image": "https://i.postimg.cc/Qtn7Wv59/latest-cb-20251226164628.webp"}, {"name": "Crimson Kitsune", "cat": "Skin", "rarity": "Skin", "value": 6720000000, "demand": 8, "image": "https://i.postimg.cc/dtg9fZh5/latest-cb-20251225145618.webp"}, {"name": "Vibe (Frame Break)", "cat": "Skin", "rarity": "Skin", "value": 8369999999, "demand": 7, "image": "https://i.postimg.cc/Bb53Pz8P/1000-cb-20260907132311.webp"}, {"name": "Arcsteel Magnet", "cat": "Skin", "rarity": "Skin", "value": 1890000000, "demand": 7, "image": "https://i.postimg.cc/6pf7xHYL/1000-cb-20260906113126.webp"}, {"name": "Runic Fiend", "cat": "Skin", "rarity": "Skin", "value": 1620000000, "demand": 10, "image": "https://i.postimg.cc/SxfXbZD6/latest-cb-20260907125448.webp"}, {"name": "Starlight Gravity", "cat": "Skin", "rarity": "Skin", "value": 300000000, "demand": 7, "image": "https://i.postimg.cc/zGFLYd0T/latest-cb-20260907114408.webp"}, {"name": "Scarlet Ghost", "cat": "Skin", "rarity": "Skin", "value": 20000000, "demand": 3, "image": "https://i.postimg.cc/zGFLYd0K/latest-cb-20260907194223.webp"}, {"name": "Lime Blade", "cat": "Skin", "rarity": "Skin", "value": 10000000, "demand": 1, "image": "https://i.postimg.cc/PJbHv7LF/latest-cb-20260907132705.webp"}, {"name": "Meme-Meme", "cat": "Skin", "rarity": "Skin", "value": 5850000000, "demand": 8, "image": ""}, {"name": "Divine Portal", "cat": "Skin", "rarity": "Skin", "value": 1860000000, "demand": 7, "image": "https://i.postimg.cc/htF9sFwc/latest-cb-20251225222313.webp"}, {"name": "Parrot", "cat": "Skin", "rarity": "Skin", "value": 6720000000, "demand": 4, "image": "https://i.postimg.cc/dt3ZNLLY/Parrot.png"}, {"name": "Purple Lightning", "cat": "Skin", "rarity": "Skin", "value": 5640000000, "demand": 10, "image": "https://i.postimg.cc/d0FsYGYD/Purple-Lightning.png"}, {"name": "Red Lightning", "cat": "Skin", "rarity": "Skin", "value": 1800000000, "demand": 6, "image": "https://i.postimg.cc/s2DmjTkH/Red-Lightning.png"}, {"name": "Yellow Lightning", "cat": "Skin", "rarity": "Skin", "value": 120000000, "demand": 8, "image": "https://i.postimg.cc/cLwx2XPV/Yellow-Lightning.png"}, {"name": "Green Lightning", "cat": "Skin", "rarity": "Skin", "value": 180000000, "demand": 6, "image": "https://i.postimg.cc/MKcKbW5Z/Green-Lightning.png"}, {"name": "Werewolf", "cat": "Skin", "rarity": "Skin", "value": 900000000, "demand": 7, "image": "https://i.postimg.cc/mr2jLmv5/Werewolf.png"}, {"name": "Rose Quartz Diamond", "cat": "Skin", "rarity": "Skin", "value": 180000000, "demand": 5, "image": "https://i.postimg.cc/02PQqRHR/Rose-Quartz.webp"}];
let fruits = {};
ITEMS.forEach(x => fruits[fid(x.name)] = { id:fid(x.name), permValue:0, ...x });
try {
  const snap = await getDocs(collection(db, "fruits"));
  snap.docs.forEach(d => { const x = d.data(); if (!x.value) return; fruits[d.id] = { ...(fruits[d.id]||{cat:"Fruit",rarity:"Common"}), id:d.id, ...x }; });
} catch (e) {}
const list = Object.values(fruits).sort((a,b)=>(b.value||0)-(a.value||0));
const noVal = false;
$("info").textContent = "Valeurs et demandes relevées sur bloxfruitsvalues.com le 19/11/2026.";
if (noVal) $("info").textContent = "⚠️ Aucune valeur saisie pour l'instant : le staff doit remplir les valeurs dans l'admin.";

const side = { A:[null,null,null,null], B:[null,null,null,null] };
let target = null, tab = "Tous";
const icon = f => f.image ? `<img class="ic r-${f.rarity}" src="${esc(f.image)}" alt="" style="object-fit:contain;padding:3px">` : `<div class="ic r-${f.rarity}">${esc(f.name.slice(0,2))}</div>`;

function renderSide(k){
  $(k).innerHTML = side[k].map((s,i)=> s ? `<div class="slot full" data-k="${k}" data-i="${i}">
      ${s.perm?'<span class="perm">PERM</span>':''}<span class="x" data-del="1">✕</span>${icon(s.f)}<b>${esc(s.f.name)}</b><small>${fmt(s.val)} · D ${s.dem??s.f.demand??0}/10</small></div>`
    : `<div class="slot" data-k="${k}" data-i="${i}"><span class="plus">＋</span><small>Ajouter</small></div>`).join("");
  $(k).querySelectorAll(".slot").forEach(el => el.onclick = e => {
    const k=el.dataset.k, i=+el.dataset.i;
    if (e.target.dataset.del) { side[k][i]=null; update(); return; }
    target = {k,i}; openPicker();
  });
  const it = side[k].filter(Boolean), tot = it.reduce((s,x)=>s+x.val,0);
  const dem = it.length ? it.reduce((s,x)=>s+(x.dem??x.f.demand??0),0)/it.length : 0;
  $("sum"+k).innerHTML = `Valeur totale : <b>${fmt(tot)}</b><br>Demande moyenne : <b>${dem.toFixed(1)}/10</b>`;
  return { tot, dem, n: it.length };
}
function update(){
  const a = renderSide("A"), b = renderSide("B"), v = $("verdict");
  const t = a.tot + b.tot; $("barA").style.width = (t? a.tot/t*100 : 50)+"%"; $("barB").style.width = (t? b.tot/t*100 : 50)+"%";
  if (!a.n || !b.n) { v.className="verdict fair"; v.textContent="Ajoute des fruits pour comparer"; return; }
  if (!a.tot && !b.tot) { v.className="verdict fair"; v.textContent="Valeurs pas encore renseignées"; return; }
  const sc = (x,d) => x * (0.8 + d*0.04), sa = sc(a.tot,a.dem), sb = sc(b.tot,b.dem);
  const diff = (sb - sa) / Math.max(sa,1) * 100;
  if (Math.abs(diff) <= 5) { v.className="verdict fair"; v.textContent=`⚖️ FAIR (${diff>0?"+":""}${diff.toFixed(0)} %)`; }
  else if (diff > 0) { v.className="verdict win"; v.textContent=`✅ WIN : +${diff.toFixed(0)} %`; }
  else { v.className="verdict lose"; v.textContent=`❌ LOSE : ${diff.toFixed(0)} %`; }
}
function openPicker(){ $("modal").classList.add("show"); $("search").value=""; renderPicker(); $("search").focus(); }
function renderPicker(){
  const tabs = ["Tous","Mythical","Legendary","Gamepass","Skin"];
  $("tabs").innerHTML = tabs.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderPicker();});
  const q = $("search").value.trim().toLowerCase();
  const L = list.filter(f => (tab==="Tous"||f.rarity===tab) && f.name.toLowerCase().includes(q));
  $("fgrid").innerHTML = L.map(f=>`<div class="fruit" data-id="${f.id}">${icon(f)}<b>${esc(f.name)}</b><small>${fmt(f.value||0)}${f.permValue?" · Perm "+fmt(f.permValue):""}</small><small>Demande ${f.demand||0}/10</small></div>`).join("") || '<p style="color:#777">Aucun fruit</p>';
  $("fgrid").querySelectorAll(".fruit").forEach(el=>el.onclick=()=>{
    const f = fruits[el.dataset.id], perm = $("permChk").checked && f.permValue>0;
    side[target.k][target.i] = { f, perm, val: perm ? f.permValue : (f.value||0), dem: perm && f.permDemand ? f.permDemand : (f.demand||0) };
    $("modal").classList.remove("show"); update();
  });
}
$("search").oninput = renderPicker;
$("close").onclick = () => $("modal").classList.remove("show");
$("modal").onclick = e => { if (e.target.id==="modal") $("modal").classList.remove("show"); };
$("reset").onclick = () => { side.A=[null,null,null,null]; side.B=[null,null,null,null]; update(); };
update();
</script>
<script type="module" src="nav.js"></script>
</body>
</html>
