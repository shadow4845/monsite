<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de trades Blox Fruits</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  .sides { display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:start; }
  @media(max-width:800px){ .sides{grid-template-columns:1fr} .vs{text-align:center} }
  .vs { font-size:34px; font-weight:800; color:#a855f7; padding-top:120px; }
  .slot { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin-bottom:8px;
    border-radius:10px; background:#12121f; border:1px solid #2a2a40; }
  .slot small { color:#999; }
  .tot { margin-top:12px; padding-top:12px; border-top:1px solid #2a2a40; font-size:15px; line-height:1.7; }
  .verdict { text-align:center; font-size:26px; font-weight:800; margin-top:24px; padding:18px; border-radius:14px; }
  .win{background:rgba(34,197,94,.15);color:#4ade80} .lose{background:rgba(239,68,68,.15);color:#f87171} .fair{background:rgba(168,85,247,.15);color:#c084fc}
  .dem { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:#374151; }
</style>
</head>
<body class="banner">
<nav>
  <b class="grad" style="font-size:20px;display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:38px;height:38px;border-radius:50%;box-shadow:0 0 12px #a855f7">Trades Blox Fruits</b>
  <div class="links"><a href="user.html" class="btn" style="padding:8px 14px">Accueil</a></div>
</nav>
<main>
  <p style="color:#bbb;margin-bottom:20px">Ajoute les fruits de chaque côté. Le calcul utilise la valeur et la demande gérées par l'admin.</p>
  <div class="sides">
    <div class="card" id="A"></div>
    <div class="vs">VS</div>
    <div class="card" id="B"></div>
  </div>
  <div class="verdict fair" id="verdict">Ajoute des fruits pour comparer</div>
  <p id="info" style="color:#777;font-size:13px;margin-top:14px;text-align:center"></p>
</main>
<script type="module">
import { db, collection, getDocs } from "./app.js";
const fmt = n => Math.round(n).toLocaleString("fr-FR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const snap = await getDocs(collection(db, "fruits"));
const fruits = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(b.value||0)-(a.value||0));
document.getElementById("info").textContent = fruits.length ? `${fruits.length} fruits dans la liste.` : "Aucun fruit pour l'instant : l'admin doit remplir la liste.";
const side = { A: [], B: [] };
const demandLabel = d => d>=8?"Très demandé":d>=6?"Demandé":d>=4?"Moyen":"Peu demandé";

function render(k, title) {
  const el = document.getElementById(k);
  const items = side[k];
  const tot = items.reduce((s,i)=>s+i.val,0);
  const dem = items.length ? items.reduce((s,i)=>s+(i.f.demand||0),0)/items.length : 0;
  el.innerHTML = `<h2 style="margin-bottom:14px">${title}</h2>
    <select id="sel${k}"><option value="">➕ Ajouter un fruit…</option>${fruits.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select>
    <label style="display:flex;gap:8px;align-items:center;margin:-6px 0 14px"><input type="checkbox" id="perm${k}" style="width:auto;margin:0"> Version permanente</label>
    ${items.map((i,n)=>`<div class="slot"><div><b>${esc(i.f.name)}</b>${i.perm?" <small>(perm)</small>":""}<br><small>${fmt(i.val)} · <span class="dem">Demande ${i.f.demand||0}/10</span></small></div>
      <button class="red small" data-k="${k}" data-n="${n}">✕</button></div>`).join("")}
    <div class="tot">Valeur totale : <b>${fmt(tot)}</b><br>Demande moyenne : <b>${dem.toFixed(1)}/10</b> ${items.length?`<span class="dem">${demandLabel(dem)}</span>`:""}</div>`;
  document.getElementById("sel"+k).onchange = e => {
    const f = fruits.find(x=>x.id===e.target.value); if(!f) return;
    const perm = document.getElementById("perm"+k).checked && f.permValue;
    side[k].push({ f, perm: !!perm, val: perm ? f.permValue : (f.value||0) });
    update();
  };
  el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { side[k].splice(+b.dataset.n,1); update(); });
  return { tot, dem };
}
function update() {
  const a = render("A","🟣 Toi"), b = render("B","⚫ Lui / Elle");
  const v = document.getElementById("verdict");
  if (!side.A.length || !side.B.length) { v.className="verdict fair"; v.textContent="Ajoute des fruits pour comparer"; return; }
  // Score = valeur ajustée par la demande (une demande forte vaut un peu plus)
  const sc = (t,d) => t * (0.8 + d*0.04);
  const sa = sc(a.tot,a.dem), sb = sc(b.tot,b.dem);
  const diff = (sb - sa) / Math.max(sa,1) * 100;
  if (Math.abs(diff) <= 5) { v.className="verdict fair"; v.textContent=`⚖️ Trade équitable (${diff>0?"+":""}${diff.toFixed(0)} %)`; }
  else if (diff > 0) { v.className="verdict win"; v.textContent=`✅ WIN : tu gagnes ~${diff.toFixed(0)} %`; }
  else { v.className="verdict lose"; v.textContent=`❌ LOSE : tu perds ~${Math.abs(diff).toFixed(0)} %`; }
}
update();
</script>
<script type="module" src="nav.js"></script>
</body>
</html>
